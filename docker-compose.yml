# finance-service y su base. Proyecto Compose propio: se levanta, actualiza o borra sin tocar a
# los demás servicios. Se usa con  ./stack.sh up finance-service  (README, "Levantar en
# desarrollo"). RabbitMQ está en el proyecto infra; finance no usa Redis.
#
# finance-db solo está en la red privada del proyecto, así que ningún otro servicio puede
# resolverla. finance-service está además en "transporte", donde lo encuentra el gateway y donde
# están RabbitMQ y fleet-service (S6 por /internal/). Los puertos solo se publican en 127.0.0.1,
# para psql, DBeaver y Swagger desde el host.

name: finance-service

services:
  finance-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance_db
      POSTGRES_USER: ${FINANCE_DB_USER}
      POSTGRES_PASSWORD: ${FINANCE_DB_PASSWORD}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - finance-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  finance-service:
    build: .
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DB_HOST: finance-db
      DB_PORT: "5432"
      DB_USER: ${FINANCE_DB_USER}
      DB_PASSWORD: ${FINANCE_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # S6: validar el bus de un gasto de taller. Si fleet no está arriba, solo ese alta responde 503.
      # 8084 es el puerto del fleet importado: el 8082, que el diseño le daba a fleet, lo usa trip.
      FLEET_URL: http://fleet-service:8084
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50   # mismo criterio que identity-service
    # Solo su base: RabbitMQ es de otro proyecto. Si no está listo, Spring AMQP reintenta la
    # conexión y el healthcheck queda en rojo hasta que llegue.
    depends_on:
      finance-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8086/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    mem_limit: 768m
    networks: [default, transporte]
    restart: unless-stopped

networks:
  transporte:
    external: true

volumes:
  finance-db-data:
